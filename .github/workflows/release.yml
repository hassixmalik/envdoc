name: Release

# Publishes to PyPI as `envdoc-cli` when a GitHub release is published.
# The command stays `envdoc`. Uses PyPI trusted publishing: no API token is
# stored anywhere. One-time setup on pypi.org: add a "pending publisher"
# for project envdoc-cli, owner hassixmalik, repo envdoc, workflow
# release.yml, environment pypi.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches pyproject version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$v" != "$tag" ]; then echo "::error::tag $GITHUB_REF_NAME does not match version $v"; exit 1; fi
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/envdoc-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
