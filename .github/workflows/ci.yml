name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: setup-python publishes no 3.9
        # build for Ubuntu 26.04, so a 3.9 job on -latest dies before
        # installing anything.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        # Tests that make real commits set GIT_AUTHOR_*/GIT_COMMITTER_*
        # themselves, so no global git identity is needed here.
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

  # envdoc checks its own repository: no env files or dumps should ever
  # be committable here.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: envdoc scan . --format github
